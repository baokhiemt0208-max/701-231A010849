        .diemdanh-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Form danh sách điểm danh */
        .list-box {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 40px;
            border: 1px solid #eaeaea;
        }

        .list-box h2 {
            margin: 0 0 20px 0;
            font-size: 1.5rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            color: #2c3e50;
        }

        .form-group {
            display: flex;
            margin-bottom: 18px;
            align-items: center;
        }

        .form-group label {
            width: 30%;
            font-weight: bold;
            color: #444;
        }

        .form-group input,
        .form-group textarea {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
            font-size: 1rem;
            background-color: #fafafa;
            color: #333;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #1976d2;
            outline: none;
            background-color: #fff;
        }

        /* Giao diện input readonly cho các trường cố định */
        .readonly-input {
            background-color: #f0f0f0 !important;
            color: #666 !important;
            border: 1px solid #ddd !important;
        }
    </style>
</head>
