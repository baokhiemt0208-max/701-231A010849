<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả Bài tập 22</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h2 {
            color: #d32f2f;
            margin-top: 0;
        }

        .result-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #ddd;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #1565c0;
        }

        /* Khung trắng chứa nội dung */
        .result-container {
            max-width: 900px;
            margin: 50px auto;
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Lệnh bắt buộc để ảnh tự động thu nhỏ vừa với khung */
        .result-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>KẾT QUẢ TRẮC NGHIỆM ISPFL</h2>
        <p>Sinh viên: <strong>Trương Bảo Khiêm</strong> - MSSV: <strong>231A010849</strong></p>

        <!-- Nhớ để ảnh ketqua22.jpg trong thư mục images -->
        <img class="result-image" src="images/ketqua.png" alt="Kết quả trắc nghiệm">

        <br>
        <a href="index.html" class="back-btn">⬅ Quay lại bài thi</a>
    </div>

</body>

</html>
